services:
  site:
    image: ruby:3.2.1
    working_dir: /site
    ports:
      - "4000:4000"
      - "35729:35729"
    volumes:
      - .:/site
      - gems:/usr/local/bundle
    command: >
      sh -c "bundle install &&
      bundle exec jekyll serve --host 0.0.0.0 --future --livereload"

volumes:
  gems:
